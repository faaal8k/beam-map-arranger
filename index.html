<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10151c">
<link rel="icon" href="data:,">
<title>مرتّب خريطة بيام</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <svg id="overlay" xmlns="http://www.w3.org/2000/svg">
      <g id="guides"></g>
      <polygon id="outline" class="outline" points=""></polygon>
      <g id="handles"></g>
    </svg>
    <div id="hud"></div>
    <div id="assetStatus" hidden></div>
    <div id="sizeTip" hidden></div>
    <div id="toast"></div>
    <div id="ctxmenu" class="ctxmenu" hidden role="menu"></div>
    <div id="intro">
      <div class="c">
        <h2>مرتّب خريطة بيام</h2>
        <p class="sm">افتح ملف المستوى (zip) أو ملفات items.level.json و .ter مباشرة. كل شيء يشتغل داخل المتصفح بدون رفع لأي سيرفر. حرّك المجسمات في العرض الثلاثي باللمس، مثل استديو الواجهات.</p>
        <button class="b on" id="bOpen2">📂 فتح الخريطة</button>
        <button class="b" id="bDemo">تجربة خريطة نموذجية</button>
        <div id="msg"></div>
      </div>
    </div>
  </div>
  <aside id="dock" class="collapsed">
    <div id="grab" role="button" aria-label="افتح القوائم">
      <span class="pip"></span>
      <button id="bCloseSheet" class="sheet-close" aria-label="إخفاء القوائم" hidden>✕</button>
    </div>
    <div id="bar">
      <button class="b" id="bOpen">📂 فتح</button>
      <button class="b" id="bMode" title="تبديل العرض" id="bModeLbl">3د</button>
      <button class="b" id="bUndo">↩️ تراجع</button>
      <button class="b" id="bFit">⤢ ملاءمة</button>
      <button class="b" id="bAdd">➕ إضافة</button>
      <button class="b ok" id="bExp">⬇️ تصدير</button>
    </div>
    <div id="sheet"></div>
  </aside>
</div>
<input type="file" id="fi" multiple accept=".zip,.json,.ter,.dae,.cs,.png,.jpg,.jpeg,.dds,.tga" hidden>
<script src="vendor/jszip.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
